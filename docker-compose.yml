services:
  server:
    build: .
    image: cbticserver:latest
    ports:
      - "8080:8080"
    environment:
      CBTIC_LOG_LEVEL: ${CBTIC_LOG_LEVEL:-info}
    restart: unless-stopped
    # Shutdown: CBTIC_SHUTDOWN_TIMEOUT (10s) + 500ms; Docker's default 10s would SIGKILL first
    stop_grace_period: 15s
